name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_CLARITAS_API_BASE_URL: ${{ vars.PUBLIC_CLARITAS_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_CLARITAS_API_BASE_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx puppeteer browsers install chrome
      - run: npm run test:e2e
      - run: npm run test:puppeteer

  deploy:
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  e2e-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://claritas-viz.github.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx puppeteer browsers install chrome
      - run: npx playwright test tests/e2e/site.spec.mjs
      - run: npm run test:puppeteer
